# Installer configuration.
#
# The app ships the native openDAQ engine with the SDK and its modules under
# resources/engine/ (engine/dist/<platform>) and the built UI
# under resources/ui/, which it serves from studio://app/. An end user needs
# nothing else, not even the openDAQ SDK.

appId: com.opendaq.studio
productName: openDAQ Studio
# The UI is in English; Electron's other 50-odd language packs are 40 MB.
electronLanguages:
  - en-US
# On macOS the language packs live inside the Electron framework; this trims them.
afterPack: scripts/after-pack.cjs
compression: maximum
copyright: openDAQ Studio contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# There is deliberately no top-level extraResources: electron-builder *merges*
# the platform entry with it rather than replacing it, which would put the macOS
# engine inside the Windows installer. Each platform names its own payload: the
# engine built for it (the Windows one is cross-built on a Mac) and the UI.

# The engine and its addon sit outside the archive, in resources/engine, where
# native libraries can be loaded.
asar: true

mac:
  extraResources:
    - from: ../engine/dist/darwin-arm64
      to: engine
      filter:
        - '**/*'
        - '!studio_cli'
    - from: ../frontend/dist
      to: ui
      filter:
        - '**/*'
        - '!**/*.map'
  category: public.app-category.developer-tools
  # No arch list on purpose: electron-builder then builds for the host, which is
  # the only architecture that can be correct. The engine and the SDK's modules
  # are native libraries of one architecture (darwin-arm64 here), so an
  # installer built for the other would look valid and fail to start.
  target:
    - target: dmg
    - target: zip
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # mDNS device discovery needs the local network on recent macOS, and the
    # Bonjour service types the openDAQ SDK's discovery uses, as its modules
    # announce and browse them (native, OPC UA, LT, WebSocket streaming and
    # the IP modification service).
    NSLocalNetworkUsageDescription: openDAQ Studio discovers measurement devices on your local network.
    NSBonjourServices:
      - _opendaq-streaming-native._tcp
      - _opcua-tcp._tcp
      - _streaming-lt._tcp
      - _streaming-ws._tcp
      - _opendaq-ip-modification._udp

# The macOS installer window: the brand gradient with the logo across the top,
# and an orange arrow between the two icon positions set below.
dmg:
  background: build/background.png
  title: ${productName} ${version}
  iconSize: 100
  iconTextSize: 12
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 250
      type: file
    - x: 390
      y: 250
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
    # A plain archive as well as the installer: it is the fastest way to tell an
    # installer problem apart from an application problem, and some sites cannot
    # run installers at all.
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
  extraResources:
    - from: ../engine/dist/windows-x86_64
      to: engine
      filter:
        - '**/*'
        - '!studio_cli.exe'
    - from: ../frontend/dist
      to: ui
      filter:
        - '**/*'
        - '!**/*.map'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: openDAQ Studio
  # Brand artwork, generated by scripts/build_icons.py from the same sources as
  # the application icon.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  # The user's settings and logs live in %LOCALAPPDATA%, which this does not
  # touch, so a reinstall keeps them.
  deleteAppDataOnUninstall: false

linux:
  # Not built or tried yet: engine/tool/build_desktop.sh
  # builds the engine on Linux into dist/linux-x86_64.
  extraResources:
    - from: ../engine/dist/linux-x86_64
      to: engine
      filter:
        - '**/*'
        - '!studio_cli'
    - from: ../frontend/dist
      to: ui
      filter:
        - '**/*'
        - '!**/*.map'
  target:
    - AppImage
    - deb
  category: Science
  icon: build/icon.png
  synopsis: Viewer, configurator and scope for openDAQ devices
